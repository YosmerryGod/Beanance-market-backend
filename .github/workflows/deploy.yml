name: Deploy Beanance Market Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: beanance-market-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull, install, and restart on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/Beanance-market-backend
            node deploy.js
